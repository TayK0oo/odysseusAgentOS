# Phase-lock — Mapping déclaratif phase → tools autorisés/retirés
# Source unique de vérité. Modifié ici = appliqué automatiquement.

phases:
  RESEARCH:
    description: "Exploration et collecte d'information uniquement"
    allowed_categories: [read, search, knowledge]
    blocked_categories: [write, exec, destructive]
    blocked_tools:
      - write_file
      - edit_file
      - create_file
      - bash
      - run_command
      - delete_file
    message: "Phase RESEARCH : écriture et exécution désactivées"

  INNOVATE:
    description: "Brainstorming et exploration de solutions"
    allowed_categories: [read, search, knowledge, draft]
    blocked_categories: [exec, destructive]
    blocked_tools:
      - bash
      - run_command
      - delete_file
    message: "Phase INNOVATE : exécution de commandes désactivée"

  PLAN:
    description: "Planification — écriture dans process/ et .planning/ uniquement"
    allowed_categories: [read, search, knowledge, draft]
    write_restriction:
      allowed_paths:
        - "process/"
        - ".planning/"
        - ".opencode/"
      message: "Phase PLAN : écriture limitée à process/ et .planning/"
    blocked_tools:
      - bash
      - run_command
      - delete_file
    message: "Phase PLAN : écriture limitée aux répertoires planning"

  BUILD:
    description: "Implémentation — accès complet"
    allowed_categories: [read, search, knowledge, write, exec, draft]
    blocked_tools: []
    message: "Phase BUILD : accès complet"

  VERIFY:
    description: "Vérification — lecture et tests uniquement"
    allowed_categories: [read, search, knowledge, exec]
    blocked_categories: [write, destructive]
    exec_restriction:
      allowed_commands_patterns:
        - "pytest"
        - "npm test"
        - "cargo test"
        - "go test"
        - "jest"
        - "vitest"
        - "playwright"
      message: "Phase VERIFY : seules les commandes de test sont autorisées"
    blocked_tools:
      - write_file
      - edit_file
      - create_file
      - delete_file
    message: "Phase VERIFY : lecture et tests uniquement"

default_phase: BUILD
