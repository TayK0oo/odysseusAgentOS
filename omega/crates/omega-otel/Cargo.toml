[package]
name = "omega-otel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Omega — tracabilite : provenance, telemetrie nommee, sinks, replay de journaux."

[dependencies]
omega-types = { workspace = true }
omega-ports = { workspace = true }
omega-registry = { workspace = true }
omega-plugin-api = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
opentelemetry = "0.24"
opentelemetry_sdk = { version = "0.24", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.17", features = ["http-proto", "reqwest-client"] }
