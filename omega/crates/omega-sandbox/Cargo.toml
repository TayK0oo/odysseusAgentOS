[package]
name = "omega-sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Omega — sandbox : politique d'execution typée + backend local avec timeout."

[dependencies]
omega-types = { workspace = true }
omega-ports = { workspace = true }
omega-registry = { workspace = true }
omega-plugin-api = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
tokio = { version = "1", features = ["process", "time", "macros", "rt"] }
nix = { version = "0.29", features = ["process", "sched", "user", "mount", "fs"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
