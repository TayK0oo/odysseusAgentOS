# omega/gates.toml — definition des portes du projet.
#
# Source : docs/omega/PLAN-MAITRE.md §6 (fichier stable, non modifie par ce gate).
# Execute par : omega/scripts/gate.py
#
# Format TOML et non YAML : parse par tomllib (stdlib Python >= 3.12), donc
# aucune dependance a installer — le venv de verify.py ne contient que
# ruff et pytest, et RULES-OMEGA interdit d'ajouter une dependance pour cela.
#
# Regle porte/code : une porte n'est pas modifiee dans le meme commit que le
# code qu'elle juge. Verifie par `gate.py --regle-porte-code`.
#
# Statuts d'un critere : VERT | ECHEC | TIMEOUT | DELEGUE_CI | VIOLATION_PORTE_CODE
# kind : command | file | ci

[meta]
source = "docs/omega/PLAN-MAITRE.md §6"
format = "toml/tomllib"

[phase0]
nom = "Verite et banc d'acceptation"

[[phase0.criteres]]
id = "G0.a"
description = "verify exit 0 sur clone vierge (execution complete, tests inclus)"
kind = "command"
argv = ["python3", "omega/scripts/verify.py", "--mode", "worktree"]
expect_exit = 0
timeout = 3600
bloquant = true

[[phase0.criteres]]
id = "G0.a.ci"
description = "verify exit 0 deux executions consecutives, en CI"
kind = "ci"
note = "delegue a la CI (job doc-gates) : deux runs sur clone vierge"
bloquant = false

[[phase0.criteres]]
id = "G0.b"
description = "STATUS.json produit par measure.py"
kind = "command"
argv = ["python3", "omega/scripts/measure.py"]
expect_exit = 0
timeout = 900
bloquant = true

[[phase0.criteres]]
id = "G0.b.doc-truth"
description = "doc-truth a 0 divergence (check_doc_truth strict par defaut)"
kind = "command"
argv = ["python3", "omega/scripts/check_doc_truth.py"]
expect_exit = 0
timeout = 300
bloquant = true

[[phase0.criteres]]
id = "G0.c.s0"
description = "S0 vert (demarrage propre)"
kind = "command"
argv = ["python3", "omega/acceptance/runner.py", "--scenario", "S0", "--mode", "scripte"]
expect_exit = 0
timeout = 600
bloquant = true

[[phase0.criteres]]
id = "G0.d"
description = "ADR D0 fusionne (moteur de reference : Rust ou Python)"
kind = "file"
path = "docs/omega/adr/0009-*.md"
must_contain = "Accept"
bloquant = true

[[phase0.criteres]]
id = "G0.e"
description = "la CI execute gate.py --phase 0"
kind = "ci"
note = "delegue a la CI : presence du job qui appelle omega/scripts/gate.py --phase 0"
bloquant = false

[phase1]
nom = "L'agent qui agit, dans une boite"

# ADR-0013 : tous les criteres sont executables, mesurables et bloquants — le
# placeholder kind="ci" (« porte non outillee », faux vert DELEGUE_CI) est mort.
# Rien d'inverse ici : chaque critere attend un PASS sec (expect_exit = 0) et
# le gate est ROUGE tant que la boucle / le registre n'est pas livre (ECHEC
# nomme, pas de vert par inversion). Aujourd'hui : rouge sincere sur S1
# (boucle absente, P1-1/ADR-0006), S2 (budgets absents, P1-3) et registre
# (adaptateurs non branches, P1-2/A4).
# NB : le xfail_raison des scenarios S1/S2 devra etre retire le jour ou le
# moteur y arrive (sinon XPASS = exit 1) — cf. ADR-0013, tournant A2.

[[phase1.criteres]]
id = "G1.a.s1"
description = "S1 outil reel canary : 5 runs tous PASS (canary obtenu par un VRAI appel d'outil + controle negatif sans surface)"
kind = "command"
argv = ["python3", "omega/acceptance/runner.py", "--scenario", "S1", "--mode", "scripte", "--runs", "5", "--attendu", "PASS"]
expect_exit = 0
timeout = 1800
bloquant = true

[[phase1.criteres]]
id = "G1.b.s2"
description = "S2 limites/budgets : 5 runs tous PASS (arret sur budget emis par le MOTEUR + controle negatif sans budget)"
kind = "command"
argv = ["python3", "omega/acceptance/runner.py", "--scenario", "S2", "--mode", "scripte", "--runs", "5", "--attendu", "PASS"]
expect_exit = 0
timeout = 1800
bloquant = true

[[phase1.criteres]]
id = "G1.c.sequence"
description = "sequence bornee S0->S1->S2 : 5 tours, tous PASS (timeout = borne explicite du critere)"
kind = "command"
argv = ["python3", "omega/acceptance/runner.py", "--scenario", "S0,S1,S2", "--mode", "scripte", "--runs", "5", "--attendu", "PASS"]
expect_exit = 0
timeout = 3600
bloquant = true

[[phase1.criteres]]
id = "G1.d.plugins"
description = "registre vif == liste nominative (13 couples : 5 cables vifs + 8 adaptateurs de production, cf. ADR-0014)"
kind = "command"
argv = ["python3", "omega/acceptance/verifier_plugins.py"]
expect_exit = 0
timeout = 1800
bloquant = true
plugins = { attendus = [
  # cables vifs au HEAD (instance jetable, GET /api/plugins) — ADR-0014
  { id = "ollama", capability = "llm-provider" },
  { id = "default", capability = "context-engine" },
  { id = "mcp:rea", capability = "tool-surface" },
  { id = "file", capability = "event-store" },
  { id = "embedded", capability = "harness-catalog" },
  # adaptateurs de production de compose_ported_crates (sans le bruit
  # #[cfg(test)] du parse brut de STATUS.json) — ADR-0014
  { id = "config/default", capability = "config-source" },
  { id = "loop/default", capability = "agent-loop" },
  { id = "workflow/default", capability = "workflow-engine" },
  { id = "agentstore/default", capability = "agent-store" },
  { id = "ui/main", capability = "ui-surface" },
  { id = "ui/sidebar", capability = "ui-surface" },
  { id = "sandbox/default", capability = "sandbox-backend" },
  { id = "skills/default", capability = "skill-store" },
] }

# Orphelins (P1-6, ADR-0014) : AUCUN critere — le detecteur n'est pas livre.
# A la livraison : ajouter un critere kind="command" executant le vrai outil
# (expect_exit = 0, comme les autres ; jamais de vert par inversion, le champ
# verdict_attendu n'existe pas dans gate.py et ne sera pas invente).

[phase2]
nom = "Se souvenir : durabilite, memoire, contexte"

# ADR-0016 : tous les criteres sont executables, mesurables et bloquants —
# le placeholder kind="ci" (« porte non outillee ») est mort, comme pour G1
# (ADR-0013). Seuils ⚙ (latence memoire p95 sur 1000 souvenirs) provisoires
# (500 ms) — a calibrer en 5 runs baseline par C3 et geler par ADR « Seuils
# v1 » avant que G2 ne puisse passer en VERT. Les criteres scriptes sont
# bloquants ; les criteres ⚙ sont non bloquants tant que non gels.

[[phase2.criteres]]
id = "G2.a.s3"
description = "S3 durabilite : 5 runs tous PASS (crash + reprise, effet exactement 1 fois)"
kind = "command"
argv = ["python3", "omega/acceptance/runner.py", "--scenario", "S3", "--mode", "scripte", "--runs", "5", "--attendu", "PASS"]
expect_exit = 0
timeout = 1800
bloquant = true

[[phase2.criteres]]
id = "G2.b.s4"
description = "S4 memoire persistante : 5 runs tous PASS (mot retrouve apres kill -9, oubli cascade) — rouge sincère jusqu'à B2 (ADR-0017-bis)"
kind = "command"
argv = ["python3", "omega/acceptance/runner.py", "--scenario", "S4", "--mode", "scripte", "--runs", "5", "--attendu", "PASS"]
expect_exit = 0
timeout = 1800
bloquant = true

[[phase2.criteres]]
id = "G2.c.s5"
description = "S5 compaction contexte : 5 runs tous PASS (faits retrouves apres compaction, budget respecte) — rouge sincère jusqu'à B3 (ADR-0017-bis)"
kind = "command"
argv = ["python3", "omega/acceptance/runner.py", "--scenario", "S5", "--mode", "scripte", "--runs", "5", "--attendu", "PASS"]
expect_exit = 0
timeout = 1800
bloquant = true

[[phase2.criteres]]
id = "G2.d.a3"
description = "A3 crash a chaque pas : matrice reduite (k=1..6) verte"
kind = "command"
argv = ["python3", "omega/acceptance/a3_crash.py", "--runs", "2"]
expect_exit = 0
timeout = 1800
bloquant = true

[[phase2.criteres]]
id = "G2.e.a1"
description = "A1 conformite par port sur MemoryStore (Jsonl + InMemory)"
kind = "command"
argv = ["python3", "omega/acceptance/a1_memory.py"]
expect_exit = 0
timeout = 600
bloquant = true

[[phase2.criteres]]
id = "G2.f.corruption"
description = "corruption journal tronque : recuperation ou erreur explicite, jamais silencieux"
kind = "command"
argv = ["cargo", "test", "--manifest-path", "omega/Cargo.toml", "-p", "omega-server", "--test", "corruption_journal"]
expect_exit = 0
timeout = 600
bloquant = true

[[phase2.criteres]]
id = "G2.g.concurrence"
description = "concurrence 2 runs : 0 mise a jour perdue"
kind = "command"
argv = ["cargo", "test", "--manifest-path", "omega/Cargo.toml", "-p", "omega-server", "--test", "concurrency_run"]
expect_exit = 0
timeout = 600
bloquant = true

[[phase2.criteres]]
id = "G2.h.cascade"
description = "oubli en cascade : 0 trace store, BM25, vecteurs apres forget"
kind = "command"
argv = ["cargo", "test", "--manifest-path", "omega/Cargo.toml", "-p", "omega-memory", "cascade"]
expect_exit = 0
timeout = 600
bloquant = true

[[phase2.criteres]]
id = "G2.i.latence"
description = "latence memoire p95 sur 1000 souvenirs < 50 ms (seuil gelé ADR-0018)"
kind = "command"
argv = ["cargo", "test", "--manifest-path", "omega/Cargo.toml", "-p", "omega-memory", "latency_memory"]
expect_exit = 0
timeout = 300
bloquant = true

[phase3]
nom = "Apprendre : skills auto-generes et surete de l'apprentissage"

[[phase3.criteres]]
id = "G3"
description = "P3 : un skill est auto-genere et rejoue (porte non outillee)"
kind = "ci"
note = "a outiller en P3"
bloquant = false

[phase4]
nom = "Ne pas deriver, deleguer"

[[phase4.criteres]]
id = "G4"
description = "P4 : sous-agents en parallele avec trace d'arbre (porte non outillee)"
kind = "ci"
note = "a outiller en P4"
bloquant = false

[phase5]
nom = "Partout : MCP, canaux, cockpit"

[[phase5.criteres]]
id = "G5"
description = "P5 : le meme cerveau pilote depuis deux canaux (porte non outillee)"
kind = "ci"
note = "a outiller en P5"
bloquant = false

[phase6]
nom = "S'adapter : routage apprenant"

[[phase6.criteres]]
id = "G6"
description = "P6 : le routeur change de modele sur feedback (porte non outillee)"
kind = "ci"
note = "a outiller en P6"
bloquant = false

[phase7]
nom = "Durcir et consolider"

[[phase7.criteres]]
id = "G7"
description = "P7 : durcissement continu (porte non outillee)"
kind = "ci"
note = "a outiller en P7"
bloquant = false
