[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"

[workspace.dependencies]
# crates internes
omega-types = { path = "crates/omega-types" }
omega-ports = { path = "crates/omega-ports" }
omega-adapters = { path = "crates/omega-adapters" }
omega-python-bridge = { path = "crates/omega-python-bridge" }
omega-config = { path = "crates/omega-config" }
omega-registry = { path = "crates/omega-registry" }
omega-plugin-api = { path = "crates/omega-plugin-api" }
omega-core = { path = "crates/omega-core" }
omega-protocol = { path = "crates/omega-protocol" }
omega-app = { path = "crates/omega-app" }
omega-context = { path = "crates/omega-context" }
omega-otel = { path = "crates/omega-otel" }
omega-sandbox = { path = "crates/omega-sandbox" }
omega-harness = { path = "crates/omega-harness" }
omega-mcp = { path = "crates/omega-mcp" }
# dependances externes
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
indexmap = "2"
async-trait = "0.1"
toml = "0.9"

[profile.release]
lto = "thin"
codegen-units = 1
