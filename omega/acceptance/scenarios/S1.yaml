id: S1
nom: outil_reel_canary
phase: P1
modes: [scripte]
prerequis: [cargo, python_3_12]
llm_scripte: outil
mise_en_situation:
  workdir: tmpdir
  fichiers: {nombre: 7, noms: hex8, contenu: hex32}
actions:
  - {demarrer_moteur: rust, llm: scripte}
  - {post: /api/run, body: {messages: [{role: user, content: "Liste les fichiers du repertoire"}]}}
attendu:
  reponse_contient_les_canaries: true
  evenement_appele_outil: true
controle_negatif:
  # le meme scenario, moteur SANS surface d'outils : le modele n'a alors
  # aucun moyen de connaitre les noms (aleatoires) — leur absence prouve
  # que la reponse nominale vient bien de l'observation de l'outil.
  desactiver: [tool_surface]
  attendu: canaries_absentes
verdict_attendu: PASS
