      {role: user, content: "remplissage 1"},
      {role: assistant, content: "ok"},
      {role: user, content: "remplissage 2"},
      {role: assistant, content: "ok"},
      {role: user, content: "remplissage 3"},
      {role: assistant, content: "ok"},
      {role: user, content: "remplissage 4"},
      {role: assistant, content: "ok"},
      {role: user, content: "Fait du milieu: BETA-9"},
      {role: assistant, content: "Bien note."},
      {role: user, content: "remplissage 5"},
      {role: assistant, content: "ok"},
      {role: user, content: "remplissage 6"},
      {role: assistant, content: "ok"},
      {role: user, content: "remplissage 7"},
      {role: assistant, content: "ok"},
      {role: user, content: "remplissage 8"},
      {role: assistant, content: "ok"},
