id: S5
nom: compaction_contexte
phase: P2
modes: [scripte]
prerequis: [cargo, python_3_12]
llm_scripte: echo
mise_en_situation:
  workdir: tmpdir
actions:
  - {demarrer_moteur: rust, llm: scripte}
  - {get: /api/health}
  - {post: /api/run, body: {messages: [{role: user, content: "Bonjour"}]}}
attendu:
  health_ok: true
controle_negatif:
  desactiver: []
  attendu: aucune
verdict_attendu: PASS
