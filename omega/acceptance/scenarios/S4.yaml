id: S4
nom: memoire_persistante
phase: P2
modes: [scripte]
prerequis: [cargo, python_3_12]
llm_scripte: react
mise_en_situation:
  workdir: tmpdir
actions:
  - {demarrer_moteur: rust, llm: scripte}
  - {post: /api/run, body: {messages: [{role: user, content: "Souviens-toi du mot: CANARY42"}], run_id: "s4-run"}}
interruption:
  kill_after_events: 2
attendu:
  reprise_reussie: true
  memoire_retrouvee: true
controle_negatif:
  desactiver: [journal]
  attendu: memoire_absente
verdict_attendu: PASS
