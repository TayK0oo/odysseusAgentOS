id: S4
nom: memoire_persistante
phase: P2
modes: [scripte]
prerequis: [cargo, python_3_12]
llm_scripte: memory
mise_en_situation:
  workdir: tmpdir
actions:
  - {demarrer_moteur: rust, llm: scripte}
  - {post: /api/run, body: {messages: [{role: user, content: "Retiens le code couleur du projet."}], run_id: "s4a"}}
  - {post: /api/run, body: {messages: [{role: user, content: "Quel est le code couleur du projet ?"}], run_id: "s4b"}}
attendu:
  memoire_retrouvee: true
controle_negatif:
  desactiver: [journal]
  attendu: memoire_absente
verdict_attendu: PASS